<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--primary:#b8862b;--primary-d:#8f6720;--accent:#e8c984;--bg:#f6f0e6;--card-bg:#fff;--ink:#1c1510;--band:#33261a;--white:#fff;--nav:72px;--pad:40px;--soft:0 4px 14px rgba(28,21,16,.1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
h2{font-size:clamp(1.8rem,3.5vw,2.6rem);margin-bottom:24px}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:1240px;margin:auto;padding:0 var(--pad)}
section{padding:56px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid var(--primary);background:var(--primary);color:var(--ink);font:700 1rem "DM Sans",sans-serif;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d);color:#fff}
.btn.o{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.o:hover{background:var(--ink);color:#fff}
.dark .btn.o,.nav .btn.o{color:#fff;border-color:#fff}
.dark .btn.o:hover{background:#fff;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.nav{position:sticky;top:0;z-index:50;height:var(--nav);background:var(--ink);color:#fff}
.nb{display:flex;align-items:center;gap:20px;height:100%}
.logo{display:flex;align-items:center;color:#fff;text-decoration:none;font:700 1.4rem Fraunces,serif}
.logo img{height:44px;width:auto}
.links{margin-left:auto;display:flex;gap:24px}
.links a{color:#fff;text-decoration:none;font-weight:500}
.links a:hover{color:var(--accent)}
.nb .btn{min-height:44px}
.soc{display:flex;gap:8px}
.sc{display:grid;place-items:center;width:40px;height:40px;border:2px solid #fff;border-radius:50%;color:#fff;text-decoration:none}
.sc svg{width:20px;height:20px}
.burger{display:none;margin-left:auto;position:relative;width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:none;cursor:pointer}
.burger span,.burger span::before,.burger span::after{position:absolute;left:12px;width:20px;height:2px;background:#fff}
.burger span{top:21px}
.burger span::before,.burger span::after{content:"";left:0}
.burger span::before{top:-6px}
.burger span::after{top:6px}
.drawer{position:fixed;inset:var(--nav) 0 0 0;z-index:49;background:var(--ink);padding:32px var(--pad);display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.drawer[hidden]{display:none}
.drawer a:not(.btn):not(.sc){color:#fff;font:600 1.8rem Fraunces,serif;text-decoration:none}
.hero{background:var(--ink);color:#fff;padding:56px 0 72px}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.eb{color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;margin:0 0 12px}
.hero h1{font-size:clamp(2.4rem,5vw,4.2rem);margin-bottom:16px}
.hero .sub{font-size:1.15rem;max-width:34ch;margin:0 0 28px}
.hp{aspect-ratio:4/5;border-radius:24px;overflow:hidden;box-shadow:var(--soft)}
.hp img,.hp .ph{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;margin:20px 0 0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-size:.9rem}
.badge::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#e5534b}
.badge.on::before{background:#4cc27f}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 16px;margin:0 -4px 16px}
.car .card{flex:0 0 min(260px,72%);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;background:var(--card-bg);border-radius:14px;box-shadow:var(--soft);transition:transform .25s,box-shadow .25s;animation:up .5s both;animation-delay:calc(var(--n)*40ms)}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(28,21,16,.16)}
.open{display:block;width:100%;padding:14px 14px 16px;border:0;background:none;border-radius:14px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.th{display:block;overflow:hidden;border-radius:50%;margin-bottom:10px}
.th img,.th .ph{width:100%;aspect-ratio:1;object-fit:cover;transition:transform .4s}
.open:hover .th img{transform:scale(1.06)}
.ph{display:grid;place-items:center;background:#ddd0b8;color:var(--ink);font:700 2.4rem Fraunces,serif;border-radius:50%}
.card h3{font:500 1rem "DM Sans",sans-serif;line-height:1.3}
.pr{margin:2px 0 0;font-weight:700}
.pill{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--accent);font-size:.78rem;font-weight:700}
.fav{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--primary-d);cursor:pointer;display:grid;place-items:center}
.fav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.fav[aria-pressed=true] svg{fill:currentColor}
.pills{position:sticky;top:var(--nav);z-index:10;display:flex;gap:8px;overflow-x:auto;padding:12px 0;margin-bottom:12px;background:var(--bg)}
.pills button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:none;color:var(--ink);font:700 .95rem "DM Sans",sans-serif;cursor:pointer}
.pills button[aria-pressed=true]{background:var(--ink);color:#fff}
.strip{background:var(--band);color:#fff;padding:20px 0}
.strip p{margin:0}
.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sp figure{margin:0;aspect-ratio:3/4;border-radius:20px;overflow:hidden}
.sp img,.sp .ph{width:100%;height:100%;object-fit:cover;border-radius:0;transition:transform .5s}
.sp figure:hover img{transform:scale(1.04)}
.banner{background:var(--band);color:#fff;padding:48px 0}
.bn{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.banner h2{margin-bottom:8px}
.banner p{margin:0;max-width:52ch}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.vg h3{font:700 1rem "DM Sans",sans-serif;margin:20px 0 4px}
.vg p{margin:0}
select{min-height:44px;border-radius:999px;border:2px solid var(--ink);background:none;color:var(--ink);padding:0 16px;font:500 1rem "DM Sans",sans-serif;max-width:100%}
table{width:100%;border-collapse:collapse;margin-bottom:24px}
td{padding:10px 0;border-bottom:1px solid #d7c9b0}
td:last-child{text-align:right}
.mapl{margin:10px 0 0}.mapl a{color:var(--ink);font-weight:700}
.map{display:block;width:100%;height:420px;border:0;border-radius:20px;background:#ddd0b8}
footer{background:var(--ink);color:#fff;padding:36px 0}
.fg{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer p{margin:0 0 4px}
footer a:not(.btn):not(.sc){color:#fff}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,92vw);color:var(--ink);background:var(--card-bg);animation:pop .25s}
dialog::backdrop{background:rgba(28,21,16,.6)}
.dc{padding:24px;text-align:center}
.dc .th{width:62%;margin:0 auto 16px}
.dc h2{font-size:1.7rem;margin-bottom:6px}
.dc .meta{font-weight:700;margin:0 0 10px}
.dc .row{justify-content:center;margin-top:18px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@media(max-width:1199px){:root{--pad:32px}}
@media(max-width:809px){
:root{--pad:20px;--nav:68px}
.links,.soc,.nb>.btn{display:none}
.burger{display:block}
.hg,.vg{grid-template-columns:1fr;gap:28px}
.hp{order:-1;aspect-ratio:1}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.open{padding:10px 8px 14px}
.sp{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
.sp figure{flex:0 0 78%;scroll-snap-align:center}
.map{height:320px}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=CONFIG,T=C.t,money=p=>C.cur+p.toFixed(2);
function fb(i){const o=i.dataset.o;if(o&&!i.dataset.r){i.dataset.r=1;i.src='https://www.thesanaacafe.com/_next/image?url='+encodeURIComponent(o.replace('https://www.thesanaacafe.com',''))+'&w=1080&q=75';return}const s=document.createElement('span');s.className='ph';s.textContent=(i.alt||'?').trim()[0];i.replaceWith(s)}
const im=(s,a,w,h)=>s?`<img src="${E(s)}" data-o="${E(s)}" alt="${E(a)}" width="${w}" height="${h}" loading="lazy" referrerpolicy="no-referrer" onerror="fb(this)">`:`<span class="ph" role="img" aria-label="${E(a)}">${E(a.trim()[0])}</span>`;

/* hours: one source for table + badge */
const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const days=s=>{const p=s.split(/[–-]/).map(x=>D.indexOf(x.trim().slice(0,3)));if(p.length<2)return[p[0]];const r=[];for(let i=p[0];;i=(i+1)%7){r.push(i);if(i==p[1])break}return r};
const mins=t=>{const m=/(\d+):(\d+)\s*([AP])M/i.exec(t);return((m[1]%12)+(/P/i.test(m[3])?12:0))*60+ +m[2]};
function status(){
if(!C.hours.length)return null;
const f=new Intl.DateTimeFormat('en-US',{timeZone:C.tz,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),g=k=>f.find(p=>p.type==k).value;
const d=D.indexOf(g('weekday')),w=10080,t=d*1440+ +g('hour')*60+ +g('minute'),sp=[];
C.hours.forEach(([ds,o,c])=>{const O=mins(o);let X=mins(c);if(X<=O)X+=1440;days(ds).forEach(x=>sp.push({a:x*1440+O,b:x*1440+X,o,c}))});
for(const s of sp)for(const k of[0,w])if(t+k>=s.a&&t+k<s.b)return{open:1,txt:'Open now · Closes '+s.c};
let best=null;for(const s of sp){const dl=(s.a-t+w)%w;if(!best||dl<best.dl)best={dl,s}}
const day=Math.floor((t+best.dl)/1440)%7;
return{open:0,txt:'Closed · Opens '+(day==d?'':D[day]+' ')+best.s.o}}

/* inject */
document.title=C.title;$('meta[name=description]').content=C.meta;
$('#logo').innerHTML=C.logo?`<img src="${E(C.logo)}" alt="${E(C.name)}" height="44" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:CONFIG.short}))">`:E(C.short);
$('#logo').setAttribute('aria-label',C.name+' home');
$('#eb').textContent=C.eyebrow;$('#h1').textContent=C.h1;$('#sub').textContent=C.sub;
$$('.ord').forEach(a=>{a.href=C.orderUrl;a.textContent=C.orderLabel;a.target='_blank';a.rel='noopener'});
const links=C.nav.map(([l,h])=>`<a href="${h}">${E(l)}</a>`).join('');
$('#links').innerHTML=links;
const IC={
Facebook:'<path fill="currentColor" d="M13.5 22v-9h3l.5-3.5h-3.5V7.3c0-1 .3-1.7 1.8-1.7H17V2.500C16.700 2.400 15.700 2.300 14.600 2.300c-2.600 0-4.100 1.500-4.100 4.300v2.900H7.500V13h3v9h3z"/>',
Instagram:'<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>',
TikTok:'<path fill="currentColor" d="M16.5 3c.3 2.3 1.7 3.8 4 4v3.2c-1.5 0-2.9-.5-4-1.3v6.1c0 3.4-2.7 5.5-5.6 5.5-3 0-5.4-2.3-5.4-5.2 0-3.200 2.800-5.500 6-5.100v3.300c-1.500-.4-2.800.6-2.800 1.900 0 1.100.9 2 2 2 1.200 0 2.100-.8 2.100-2.200V3h3.700z"/>'};
const soc=Object.entries(C.social).map(([k,u])=>{const s=`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]||''}</svg>`;return u?`<a class="sc" href="${E(u)}" target="_blank" rel="noopener" aria-label="${E(C.name)} on ${k}">${s}</a>`:`<span class="sc" role="img" aria-label="${k}">${s}</span>`}).join('');
$('#nsoc').innerHTML=soc;$('#fsoc').innerHTML=soc;
$('#drawer').innerHTML=links+`<a class="btn ord" href="${E(C.orderUrl)}" target="_blank" rel="noopener">${E(C.orderLabel)}</a><div class="soc">${soc}</div>`;
const bg=$('#bg'),dr=$('#drawer');
const tog=o=>{dr.hidden=!o;bg.setAttribute('aria-expanded',o);bg.setAttribute('aria-label',o?'Close menu':'Open menu');document.body.style.overflow=o?'hidden':''};
bg.onclick=()=>tog(dr.hidden);dr.onclick=e=>{if(e.target.closest('a'))tog(false)};
matchMedia('(min-width:810px)').onchange=e=>e.matches&&tog(false);
$('#hp').innerHTML=im(C.hero.src,C.hero.alt,800,1000);
const st=status();if(st){const b=$('#bd');b.hidden=false;b.textContent=st.txt;b.className='badge '+(st.open?'on':'')}
$('#sigh').textContent=T.sig;$('#seeall').textContent=T.all;$('#menuh').textContent=T.menu;$('#spaceh').textContent=T.space;$('#vh').textContent=T.visit;

/* menu */
const fav=(()=>{try{return JSON.parse(localStorage.getItem(C.slug+':favs')||'[]')}catch(e){return[]}})();
const save=()=>{try{localStorage.setItem(C.slug+':favs',JSON.stringify(fav))}catch(e){}};
const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S3.5 15 3.5 9.2A4.7 4.7 0 0 1 12 6.6a4.7 4.7 0 0 1 8.5 2.6C20.5 15 12 20.5 12 20.5z"/></svg>';
const card=(m,n)=>`<article class="card" style="--n:${Math.min(n,12)}"><button class="open" data-s="${m.s}"><span class="th">${im(m.i,m.t,300,300)}</span><h3>${E(m.t)}</h3><p class="pr">${money(m.p)}</p>${m.b?`<span class="pill">${E(m.b)}</span>`:''}</button><button class="fav" data-s="${m.s}" aria-pressed="${fav.includes(m.s)}" aria-label="Favorite ${E(m.t)}">${heart}</button></article>`;
$('#car').innerHTML=MENU.filter(m=>m.f).map(card).join('');
const cats=[...new Set(MENU.map(m=>m.c))];let cur='All';
function draw(){
$('#pills').innerHTML=['All',...cats].map(c=>`<button aria-pressed="${c==cur}" data-c="${E(c)}">${E(c)}</button>`).join('');
$('#grid').innerHTML=MENU.filter(m=>cur=='All'||m.c==cur).map(card).join('')}
$('#pills').onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.c;draw()}};
draw();
const dlg=$('#dlg');
function show(s){const m=MENU.find(x=>x.s==s);if(!m)return;
const meta=[money(m.p),m.w,m.c,m.b].filter(Boolean).join(' · '),u=m.g||C.orderUrl;
$('#dc').innerHTML=`<span class="th">${im(m.i,m.t,300,300)}</span><h2 id="dt">${E(m.t)}</h2><p class="meta">${E(meta)}</p><p>${E(m.d)}</p><div class="row"><a class="btn" href="${E(u)}" target="_blank" rel="noopener">${E(C.orderLabel)}</a><button class="btn o" id="cl">${E(T.close)}</button></div>`;
$('#cl').onclick=()=>dlg.close();dlg.showModal()}
dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
document.addEventListener('click',e=>{
const f=e.target.closest('.fav');
if(f){const s=f.dataset.s,i=fav.indexOf(s);i<0?fav.push(s):fav.splice(i,1);save();$$(`.fav[data-s="${s}"]`).forEach(b=>b.setAttribute('aria-pressed',fav.includes(s)));return}
const o=e.target.closest('.open');if(o)show(o.dataset.s)});

/* strip, space, reviews */
if(C.strip&&C.strip.text){$('#strip').hidden=false;$('#striptxt').innerHTML=`<strong>${E(C.strip.label)}</strong> ${E(C.strip.text)}`}
$('#sp').innerHTML=C.space.map(p=>`<figure>${im(p.src,p.alt,600,800)}</figure>`).join('');
$('#rh').textContent=T.rh;$('#rp').textContent=T.rp;
[$('#rb'),$('#fr')].forEach(a=>{a.textContent=T.rev;C.reviewUrl?a.href=C.reviewUrl:a.hidden=true});

/* visit */
$('#hrs').innerHTML=C.hours.length?C.hours.map(([d,o,c])=>`<tr><td>${E(d)}</td><td>${E(o)} – ${E(c)}</td></tr>`).join(''):`<tr><td colspan="2">${E(T.hrsEmpty)}</td></tr>`;
$('#dir').textContent=T.dir;$('#mapa').textContent=T.openMap;
$('#em').textContent=C.email;$('#em').href='mailto:'+C.email;$('#fe').innerHTML=`<a href="mailto:${E(C.email)}">${E(C.email)}</a>`;
function loc(i){const l=C.locs[i],pid=l.pid||C.placeId;
$('#addr').textContent=l.n+' · '+l.a;
$('#dir').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(l.a)+(pid?'&destination_place_id='+encodeURIComponent(pid):'');
$('#map').title=T.mapTitle+' – '+l.n;
$('#map').src=l.embed||'https://maps.google.com/maps?q='+encodeURIComponent(l.q||l.a)+'&output=embed';
$('#mapa').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l.a)+(pid?'&query_place_id='+encodeURIComponent(pid):'');
$('#fa').textContent=l.a}
if(C.locs.length>1){const s=$('#loc');s.hidden=false;$('#locl').hidden=false;$('#locl').style.cssText='position:absolute;left:-9999px';s.innerHTML=C.locs.map((l,i)=>`<option value="${i}">${E(l.n)}</option>`).join('');s.onchange=()=>loc(s.value)}
loc(0);
$('#fn').textContent=C.name;$('#fc').textContent='© '+new Date().getFullYear()+' '+C.name;
</script>
